<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Girls Night - Live Profiles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo">Girls Night ❤️</div>
    <div class="chip-row" id="top-chips"></div>
  </header>

  <main class="phone-shell">
    <section class="card hero">
      <img class="avatar" src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=300&q=80" alt="Host avatar">
      <h1>Ashnayi World ♥</h1>
      <p>Online • Hindi + English • Fast reply</p>
      <div class="btns">
        <button class="btn green">📞 Accept</button>
        <button class="btn red">❌ Decline</button>
      </div>
    </section>

    <section class="list card" id="features"></section>

    <section class="card">
      <h2>🔥 Trending Creators</h2>
      <div class="grid two" id="trending"></div>
    </section>

    <section class="card">
      <h2>💖 Recently Active</h2>
      <div class="grid three" id="active"></div>
    </section>

    <section class="card mini-stats" id="stats"></section>

    <section class="card">
      <h2>✨ Explore More</h2>
      <div class="grid three" id="explore"></div>
    </section>

    <section class="card center">
      <h2>Connect now</h2>
      <p>Safe, instant and private voice chat.</p>
      <button class="btn pink">Start Free Trial</button>
    </section>
  </main>

  <footer>© 2026 Girls Night • Demo UI</footer>
  <script src="script.js"></script>
</body>
</html>
